<script src="js/app.js"></script>


<script>

initTheme();

renderNav();


const b =
  document.getElementById(
    "themeBtn"
  );


b.textContent =
  document.documentElement
    .getAttribute("data-theme") === "dark"
      ? "🌙"
      : "☀️";


b.addEventListener(
  "click",
  () => {

    b.textContent =
      toggleTheme() === "dark"
        ? "🌙"
        : "☀️";

  }
);

</script>
