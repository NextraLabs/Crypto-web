<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#05070a"
  >

  <meta
    name="description"
    content="Update Password — NEXTRA"
  >

  <title>Password Baru — NEXTRA</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      font-family: Arial, sans-serif;

      background: #05070a;

      color: #fff;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 400px;

      background: #0c1013;

      border:
        1px solid
        rgba(255,255,255,.08);

      border-radius: 22px;

      padding: 30px;

      box-shadow:
        0 25px 80px
        rgba(0,0,0,.45);
    }

    /* LOGO */

    .logo {
      text-align: center;

      margin-bottom: 28px;
    }

    .logo h1 {
      font-size: 34px;

      letter-spacing: -1px;
    }

    .logo span {
      color: #42f5a7;
    }

    .logo p {
      color: #7f8a91;

      font-size: 12px;

      margin-top: 6px;
    }

    /* TITLE */

    h2 {
      font-size: 22px;

      margin-bottom: 8px;
    }

    .subtitle {
      color: #7f8a91;

      font-size: 12px;

      line-height: 1.5;

      margin-bottom: 22px;
    }

    /* MESSAGE */

    .message {
      display: none;

      padding: 11px;

      border-radius: 10px;

      font-size: 12px;

      line-height: 1.5;

      margin-bottom: 15px;
    }

    .message.show {
      display: block;
    }

    .error {
      background:
        rgba(255,70,70,.1);

      color: #ff8585;

      border:
        1px solid
        rgba(255,70,70,.12);
    }

    .success {
      background:
        rgba(66,245,167,.1);

      color: #42f5a7;

      border:
        1px solid
        rgba(66,245,167,.12);
    }

    /* LABEL */

    label {
      display: block;

      font-size: 12px;

      margin-bottom: 7px;
    }

    /* PASSWORD */

    .password-wrapper {
      position: relative;

      margin-bottom: 16px;
    }

    .password-wrapper input {
      padding-right: 50px;
    }

    input {
      width: 100%;

      height: 46px;

      border-radius: 12px;

      border:
        1px solid
        rgba(255,255,255,.1);

      background: #12171a;

      color: white;

      padding: 0 14px;

      outline: none;

      transition: .2s ease;
    }

    input:focus {
      border-color: #42f5a7;

      box-shadow:
        0 0 0 3px
        rgba(66,245,167,.06);
    }

    input::placeholder {
      color: #59636a;
    }

    /* EYE */

    .toggle-password {
      position: absolute;

      right: 7px;

      top: 50%;

      transform:
        translateY(-50%);

      width: 38px;

      height: 38px;

      padding: 0;

      margin: 0;

      border: none;

      border-radius: 9px;

      background: transparent;

      color: #69747b;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;

      transition: .2s ease;
    }

    .toggle-password:hover {
      background:
        rgba(255,255,255,.05);

      color: #42f5a7;
    }

    .toggle-password:active {
      transform:
        translateY(-50%)
        scale(.94);
    }

    .toggle-password svg {
      width: 20px;

      height: 20px;
    }

    /* PASSWORD STRENGTH */

    .password-hint {
      color: #59636a;

      font-size: 10px;

      margin-top: -8px;

      margin-bottom: 16px;

      line-height: 1.5;
    }

    /* BUTTON */

    .submit-button {
      width: 100%;

      height: 46px;

      border: none;

      border-radius: 12px;

      background: #42f5a7;

      color: #06100b;

      font-weight: bold;

      cursor: pointer;

      transition: .2s ease;
    }

    .submit-button:hover {
      filter: brightness(1.05);
    }

    .submit-button:active {
      transform: scale(.98);
    }

    .submit-button:disabled {
      opacity: .6;

      cursor: not-allowed;

      transform: none;
    }

    /* LINK */

    .links {
      text-align: center;

      margin-top: 20px;

      font-size: 12px;

      color: #7f8a91;
    }

    a {
      color: #42f5a7;

      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* MOBILE */

    @media (max-width: 360px) {

      .box {
        padding: 24px;
      }

      .logo h1 {
        font-size: 30px;
      }

    }

  </style>

</head>

<body>

  <div class="box">

    <!-- LOGO -->

    <div class="logo">

      <h1>
        NEXTRA<span>.</span>
      </h1>

      <p>
        Your Market. Your Intelligence.
      </p>

    </div>


    <!-- TITLE -->

    <h2>
      Buat Password Baru
    </h2>

    <p class="subtitle">
      Masukkan password baru untuk mengamankan akun NEXTRA kamu.
    </p>


    <!-- MESSAGE -->

    <div
      id="message"
      class="message"
    ></div>


    <!-- FORM -->

    <form id="updateForm">

      <!-- NEW PASSWORD -->

      <label for="password">
        Password Baru
      </label>

      <div class="password-wrapper">

        <input
          type="password"
          id="password"
          placeholder="Masukkan password baru"
          autocomplete="new-password"
          minlength="6"
          required
        >

        <button
          type="button"
          class="toggle-password"
          id="togglePassword"
          aria-label="Tampilkan password"
          title="Tampilkan password"
        >

          <svg
            id="eyeIcon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >

            <path
              d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
            />

            <circle
              cx="12"
              cy="12"
              r="3"
            />

          </svg>

        </button>

      </div>


      <p class="password-hint">
        Gunakan minimal 6 karakter untuk password baru.
      </p>


      <!-- CONFIRM PASSWORD -->

      <label for="confirmPassword">
        Ulangi Password Baru
      </label>

      <div class="password-wrapper">

        <input
          type="password"
          id="confirmPassword"
          placeholder="Ulangi password baru"
          autocomplete="new-password"
          minlength="6"
          required
        >

        <button
          type="button"
          class="toggle-password"
          id="toggleConfirm"
          aria-label="Tampilkan password"
          title="Tampilkan password"
        >

          <svg
            id="confirmEyeIcon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >

            <path
              d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
            />

            <circle
              cx="12"
              cy="12"
              r="3"
            />

          </svg>

        </button>

      </div>


      <!-- SUBMIT -->

      <button
        id="updateButton"
        class="submit-button"
        type="submit"
      >
        Simpan Password Baru
      </button>

    </form>


    <!-- LOGIN -->

    <div class="links">

      <a href="login.html">
        ← Kembali ke Login
      </a>

    </div>

  </div>


  <!-- SUPABASE -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <script>

    /* =====================================
       SUPABASE CONFIG
    ===================================== */

    const SUPABASE_URL =
      "https://uvtbntwgooxqjbyjkvkd.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Ensrp6OEPwQCoY76nQMFDg_lEofX2qO";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =====================================
       ELEMENTS
    ===================================== */

    const form =
      document.getElementById(
        "updateForm"
      );

    const passwordInput =
      document.getElementById(
        "password"
      );

    const confirmPasswordInput =
      document.getElementById(
        "confirmPassword"
      );

    const togglePassword =
      document.getElementById(
        "togglePassword"
      );

    const toggleConfirm =
      document.getElementById(
        "toggleConfirm"
      );

    const eyeIcon =
      document.getElementById(
        "eyeIcon"
      );

    const confirmEyeIcon =
      document.getElementById(
        "confirmEyeIcon"
      );

    const message =
      document.getElementById(
        "message"
      );

    const updateButton =
      document.getElementById(
        "updateButton"
      );


    /* =====================================
       MESSAGE
    ===================================== */

    function showMessage(
      text,
      type
    ) {

      message.textContent =
        text;

      message.className =
        "message show " + type;

    }


    function hideMessage() {

      message.textContent =
        "";

      message.className =
        "message";

    }


    /* =====================================
       PASSWORD ICON
    ===================================== */

    function eyeOpenIcon() {

      return `
        <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
        <circle cx="12" cy="12" r="3"/>
      `;

    }


    function eyeClosedIcon() {

      return `
        <path d="M3 3l18 18"/>
        <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
        <path d="M9.9 5.2A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a18.5 18.5 0 0 1-3.1 3.8"/>
        <path d="M6.6 6.6C3.6 8.4 2 12 2 12s3.5 7 10 7a10.5 10.5 0 0 0 3.4-.6"/>
      `;

    }


    /* =====================================
       TOGGLE PASSWORD
    ===================================== */

    togglePassword.addEventListener(
      "click",
      function() {

        const hidden =
          passwordInput.type === "password";

        if (hidden) {

          passwordInput.type =
            "text";

          eyeIcon.innerHTML =
            eyeClosedIcon();

          togglePassword.setAttribute(
            "aria-label",
            "Sembunyikan password"
          );

        } else {

          passwordInput.type =
            "password";

          eyeIcon.innerHTML =
            eyeOpenIcon();

          togglePassword.setAttribute(
            "aria-label",
            "Tampilkan password"
          );

        }

      }
    );


    /* =====================================
       TOGGLE CONFIRM PASSWORD
    ===================================== */

    toggleConfirm.addEventListener(
      "click",
      function() {

        const hidden =
          confirmPasswordInput.type === "password";

        if (hidden) {

          confirmPasswordInput.type =
            "text";

          confirmEyeIcon.innerHTML =
            eyeClosedIcon();

          toggleConfirm.setAttribute(
            "aria-label",
            "Sembunyikan password"
          );

        } else {

          confirmPasswordInput.type =
            "password";

          confirmEyeIcon.innerHTML =
            eyeOpenIcon();

          toggleConfirm.setAttribute(
            "aria-label",
            "Tampilkan password"
          );

        }

      }
    );


    /* =====================================
       UPDATE PASSWORD
    ===================================== */

    form.addEventListener(
      "submit",
      async function(e) {

        e.preventDefault();

        hideMessage();


        const password =
          passwordInput.value;

        const confirmPassword =
          confirmPasswordInput.value;


        /* VALIDATION */

        if (!password) {

          showMessage(
            "Masukkan password baru.",
            "error"
          );

          passwordInput.focus();

          return;
        }


        if (password.length < 6) {

          showMessage(
            "Password minimal 6 karakter.",
            "error"
          );

          passwordInput.focus();

          return;
        }


        if (!confirmPassword) {

          showMessage(
            "Ulangi password baru kamu.",
            "error"
          );

          confirmPasswordInput.focus();

          return;
        }


        if (
          password !==
          confirmPassword
        ) {

          showMessage(
            "Password tidak cocok.",
            "error"
          );

          confirmPasswordInput.focus();

          return;
        }


        /* BUTTON */

        updateButton.disabled =
          true;

        updateButton.textContent =
          "Menyimpan...";


        showMessage(
          "Sedang memperbarui password...",
          "success"
        );


        try {

          /* UPDATE SUPABASE */

          const {
            error
          } =
            await supabaseClient
              .auth
              .updateUser({
                password:
                  password
              });


          /* ERROR */

          if (error) {

            console.error(
              "Update password error:",
              error
            );

            showMessage(
              "Gagal memperbarui password. Link reset mungkin sudah kedaluwarsa.",
              "error"
            );

            updateButton.disabled =
              false;

            updateButton.textContent =
              "Simpan Password Baru";

            return;
          }


          /* SUCCESS */

          showMessage(
            "Password berhasil diperbarui! Mengarahkan ke Login...",
            "success"
          );


          updateButton.textContent =
            "Berhasil ✓";


          /* SIGN OUT */

          await supabaseClient
            .auth
            .signOut();


          /* REDIRECT */

          setTimeout(
            () => {

              window.location.href =
                "login.html";

            },
            1200
          );


        } catch (error) {

          console.error(
            "Unexpected error:",
            error
          );

          showMessage(
            "Terjadi kesalahan. Coba lagi.",
            "error"
          );

          updateButton.disabled =
            false;

          updateButton.textContent =
            "Simpan Password Baru";

        }

      }
    );

  </script>

</body>

  </html>
