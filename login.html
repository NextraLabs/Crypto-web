<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#05070a"
  >

  <meta
    name="description"
    content="Login NEXTRA — Your Market. Your Intelligence."
  >

  <title>Login — NEXTRA</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      font-family: Arial, sans-serif;

      background: #05070a;

      color: #fff;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;

      background: #0c1013;

      border:
        1px solid
        rgba(255,255,255,.08);

      border-radius: 22px;

      padding: 30px;

      box-shadow:
        0 25px 80px
        rgba(0,0,0,.45);
    }

    /* LOGO */

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo h1 {
      font-size: 34px;
      letter-spacing: -1px;
    }

    .logo span {
      color: #42f5a7;
    }

    .logo p {
      color: #7f8a91;
      font-size: 12px;
      margin-top: 6px;
    }

    /* TITLE */

    h2 {
      font-size: 22px;
      margin-bottom: 7px;
    }

    .subtitle {
      color: #7f8a91;
      font-size: 12px;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    /* MESSAGE */

    .message {
      display: none;

      padding: 11px;

      border-radius: 10px;

      font-size: 12px;

      margin-bottom: 15px;

      line-height: 1.5;
    }

    .message.show {
      display: block;
    }

    .error {
      background:
        rgba(255,70,70,.1);

      color: #ff8585;

      border:
        1px solid
        rgba(255,70,70,.12);
    }

    .success {
      background:
        rgba(66,245,167,.1);

      color: #42f5a7;

      border:
        1px solid
        rgba(66,245,167,.12);
    }

    /* LABEL */

    label {
      display: block;

      font-size: 12px;

      margin-bottom: 7px;
    }

    /* INPUT */

    input {
      width: 100%;

      height: 46px;

      border-radius: 12px;

      border:
        1px solid
        rgba(255,255,255,.1);

      background: #12171a;

      color: white;

      padding: 0 14px;

      outline: none;

      transition: .2s ease;
    }

    input:focus {
      border-color: #42f5a7;

      box-shadow:
        0 0 0 3px
        rgba(66,245,167,.06);
    }

    input::placeholder {
      color: #59636a;
    }

    /* PASSWORD */

    .password-wrapper {
      position: relative;

      margin-bottom: 12px;
    }

    .password-wrapper input {
      padding-right: 52px;
    }

    .toggle-password {
      position: absolute;

      right: 7px;

      top: 50%;

      transform:
        translateY(-50%);

      width: 38px;

      height: 38px;

      padding: 0;

      margin: 0;

      border: none;

      border-radius: 9px;

      background: transparent;

      color: #69747b;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;
    }

    .toggle-password:hover {
      background:
        rgba(255,255,255,.05);

      color: #42f5a7;
    }

    .toggle-password svg {
      width: 20px;
      height: 20px;
    }

    /* OPTIONS */

    .login-options {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      margin-bottom: 18px;

      font-size: 11px;

      color: #7f8a91;
    }

    .remember {
      display: flex;

      align-items: center;

      gap: 7px;

      cursor: pointer;

      margin: 0;

      font-size: 11px;
    }

    .remember input {
      width: 15px;
      height: 15px;

      margin: 0;

      accent-color: #42f5a7;

      cursor: pointer;
    }

    .forgot-link {
      color: #42f5a7;

      text-decoration: none;

      white-space: nowrap;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    /* LOGIN BUTTON */

    .login-button {
      width: 100%;

      height: 46px;

      border: none;

      border-radius: 12px;

      background: #42f5a7;

      color: #06100b;

      font-weight: bold;

      cursor: pointer;

      transition: .2s ease;
    }

    .login-button:hover {
      filter: brightness(1.05);
    }

    .login-button:active {
      transform: scale(.98);
    }

    .login-button:disabled {
      opacity: .6;

      cursor: not-allowed;

      transform: none;
    }

    /* SECURITY */

    .security {
      display: flex;

      align-items: center;

      justify-content: center;

      gap: 7px;

      margin-top: 13px;

      color: #59636a;

      font-size: 10px;

      text-align: center;
    }

    .security-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: #42f5a7;

      box-shadow:
        0 0 8px
        rgba(66,245,167,.6);
    }

    /* DIVIDER */

    .divider {
      display: flex;

      align-items: center;

      gap: 10px;

      margin: 22px 0;

      color: #555;

      font-size: 10px;
    }

    .divider::before,
    .divider::after {
      content: "";

      height: 1px;

      background:
        rgba(255,255,255,.08);

      flex: 1;
    }

    /* GOOGLE */

    .google-button {
      width: 100%;

      height: 46px;

      border-radius: 12px;

      border:
        1px solid
        rgba(255,255,255,.1);

      background: #12171a;

      color: #fff;

      font-weight: bold;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      transition: .2s ease;
    }

    .google-button:hover {
      background: #171d21;

      border-color:
        rgba(255,255,255,.18);
    }

    .google-icon {
      width: 19px;
      height: 19px;
    }

    .google-button:disabled {
      opacity: .6;

      cursor: not-allowed;
    }

    /* RESEND */

    .resend {
      display: none;

      text-align: center;

      margin-top: 15px;

      font-size: 11px;

      color: #7f8a91;

      line-height: 1.5;
    }

    .resend.show {
      display: block;
    }

    .resend button {
      width: auto;

      height: auto;

      border: none;

      background: transparent;

      color: #42f5a7;

      padding: 0;

      margin: 0;

      font-size: 11px;

      cursor: pointer;
    }

    .resend button:hover {
      text-decoration: underline;
    }

    /* LINKS */

    .links {
      text-align: center;

      margin-top: 18px;

      font-size: 12px;

      color: #7f8a91;
    }

    a {
      color: #42f5a7;

      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* MOBILE */

    @media (max-width: 360px) {

      .login-box {
        padding: 24px;
      }

      .logo h1 {
        font-size: 30px;
      }

    }

  </style>

</head>

<body>

  <div class="login-box">

    <!-- LOGO -->

    <div class="logo">

      <h1>
        NEXTRA<span>.</span>
      </h1>

      <p>
        Your Market. Your Intelligence.
      </p>

    </div>


    <!-- TITLE -->

    <h2>
      Masuk
    </h2>

    <p class="subtitle">
      Masuk ke akun NEXTRA kamu.
    </p>


    <!-- MESSAGE -->

    <div
      id="message"
      class="message"
    ></div>


    <!-- FORM -->

    <form id="loginForm">

      <!-- EMAIL -->

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="nama@email.com"
        autocomplete="email"
        required
      >


      <!-- PASSWORD -->

      <label for="password">
        Password
      </label>

      <div class="password-wrapper">

        <input
          type="password"
          id="password"
          placeholder="Masukkan password"
          autocomplete="current-password"
          minlength="6"
          required
        >

        <button
          type="button"
          class="toggle-password"
          id="togglePassword"
          aria-label="Tampilkan password"
          title="Tampilkan password"
        >

          <svg
            id="eyeIcon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >

            <path
              d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
            />

            <circle
              cx="12"
              cy="12"
              r="3"
            />

          </svg>

        </button>

      </div>


      <!-- OPTIONS -->

      <div class="login-options">

        <label class="remember">

          <input
            type="checkbox"
            id="rememberMe"
            checked
          >

          <span>
            Ingat Saya
          </span>

        </label>


        <a
          href="forgot-password.html"
          class="forgot-link"
        >
          Lupa password?
        </a>

      </div>


      <!-- LOGIN -->

      <button
        id="loginButton"
        class="login-button"
        type="submit"
      >
        Masuk
      </button>


    </form>


    <!-- SECURITY -->

    <div class="security">

      <span class="security-dot"></span>

      Login aman & terenkripsi

    </div>


    <!-- RESEND VERIFICATION -->

    <div
      id="resendArea"
      class="resend"
    >

      Belum menerima email verifikasi?

      <br>

      <button
        type="button"
        id="resendButton"
      >
        Kirim ulang verifikasi email
      </button>

    </div>


    <!-- DIVIDER -->

    <div class="divider">
      ATAU
    </div>


    <!-- GOOGLE -->

    <button
      type="button"
      id="googleButton"
      class="google-button"
    >

      <svg
        class="google-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >

        <path
          fill="#4285F4"
          d="M21.35 12.27c0-.78-.07-1.53-.22-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.42Z"
        />

        <path
          fill="#34A853"
          d="M12 21.98c2.63 0 4.84-.87 6.45-2.35l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.52A9.75 9.75 0 0 0 12 21.98Z"
        />

        <path
          fill="#FBBC05"
          d="M6.54 14.07A5.86 5.86 0 0 1 6.23 12c0-.72.12-1.42.31-2.07V7.41H3.3A9.98 9.98 0 0 0 2.25 12c0 1.61.39 3.14 1.05 4.59l3.24-2.52Z"
        />

        <path
          fill="#EA4335"
          d="M12 5.9c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.83 2.98 14.63 2.02 12 2.02a9.75 9.75 0 0 0-8.7 5.39l3.24 2.52C7.31 7.62 9.46 5.9 12 5.9Z"
        />

      </svg>

      Masuk dengan Google

    </button>


    <!-- REGISTER -->

    <div class="links">

      Belum punya akun?

      <a href="register.html">
        Buat akun
      </a>

    </div>


    <!-- HOME -->

    <div class="links">

      <a href="index.html">
        ← Kembali ke NEXTRA
      </a>

    </div>

  </div>


  <!-- SUPABASE -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <script>

    /* =====================================
       SUPABASE
    ===================================== */

    const SUPABASE_URL =
      "https://uvtbntwgooxqjbyjkvkd.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Ensrp6OEPwQCoY76nQMFDg_lEofX2qO";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );


    /* =====================================
       ELEMENTS
    ===================================== */

    const form =
      document.getElementById(
        "loginForm"
      );

    const emailInput =
      document.getElementById(
        "email"
      );

    const passwordInput =
      document.getElementById(
        "password"
      );

    const togglePassword =
      document.getElementById(
        "togglePassword"
      );

    const eyeIcon =
      document.getElementById(
        "eyeIcon"
      );

    const rememberMe =
      document.getElementById(
        "rememberMe"
      );

    const message =
      document.getElementById(
        "message"
      );

    const loginButton =
      document.getElementById(
        "loginButton"
      );

    const resendArea =
      document.getElementById(
        "resendArea"
      );

    const resendButton =
      document.getElementById(
        "resendButton"
      );

    const googleButton =
      document.getElementById(
        "googleButton"
      );


    /* =====================================
       MESSAGE
    ===================================== */

    function showMessage(
      text,
      type
    ) {

      message.textContent =
        text;

      message.className =
        "message show " + type;

    }


    function hideMessage() {

      message.textContent =
        "";

      message.className =
        "message";

    }


    /* =====================================
       EYE ICON
    ===================================== */

    function eyeOpen() {

      return `
        <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
        <circle cx="12" cy="12" r="3"/>
      `;

    }


    function eyeClosed() {

      return `
        <path d="M3 3l18 18"/>
        <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
        <path d="M9.9 5.2A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a18.5 18.5 0 0 1-3.1 3.8"/>
        <path d="M6.6 6.6C3.6 8.4 2 12 2 12s3.5 7 10 7a10.5 10.5 0 0 0 3.4-.6"/>
      `;

    }


    /* =====================================
       SHOW / HIDE PASSWORD
    ===================================== */

    togglePassword.addEventListener(
      "click",
      function() {

        const hidden =
          passwordInput.type === "password";

        if (hidden) {

          passwordInput.type =
            "text";

          eyeIcon.innerHTML =
            eyeClosed();

          togglePassword.setAttribute(
            "aria-label",
            "Sembunyikan password"
          );

        } else {

          passwordInput.type =
            "password";

          eyeIcon.innerHTML =
            eyeOpen();

          togglePassword.setAttribute(
            "aria-label",
            "Tampilkan password"
          );

        }

      }
    );


    /* =====================================
       LOGIN
    ===================================== */

    form.addEventListener(
      "submit",
      async function(e) {

        e.preventDefault();

        hideMessage();

        resendArea.classList.remove(
          "show"
        );


        const email =
          emailInput
            .value
            .trim();

        const password =
          passwordInput
            .value;


        if (!email) {

          showMessage(
            "Masukkan email kamu.",
            "error"
          );

          emailInput.focus();

          return;

        }


        if (!emailInput.checkValidity()) {

          showMessage(
            "Format email tidak valid.",
            "error"
          );

          emailInput.focus();

          return;

        }


        if (!password) {

          showMessage(
            "Masukkan password kamu.",
            "error"
          );

          passwordInput.focus();

          return;

        }


        if (password.length < 6) {

          showMessage(
            "Password minimal 6 karakter.",
            "error"
          );

          passwordInput.focus();

          return;

        }


        loginButton.disabled =
          true;

        googleButton.disabled =
          true;

        loginButton.textContent =
          "Memproses...";


        showMessage(
          "Sedang masuk ke akun kamu...",
          "success"
        );


        try {

          /*
            Supabase Auth menggunakan
            session persistence otomatis.
          */

          const {
            data,
            error
          } =
            await supabaseClient
              .auth
              .signInWithPassword({

                email:
                  email,

                password:
                  password

              });


          if (error) {

            console.error(
              "Login error:",
              error
            );


            const errorText =
              (
                error.message ||
                ""
              ).toLowerCase();


            if (
              errorText.includes(
                "email not confirmed"
              )
            ) {

              showMessage(
                "Email kamu belum diverifikasi.",
                "error"
              );

              resendArea.classList.add(
                "show"
              );

            } else if (
              errorText.includes(
                "invalid login credentials"
              )
            ) {

              showMessage(
                "Email atau password salah.",
                "error"
              );

            } else {

              showMessage(
                "Login gagal. Coba lagi.",
                "error"
              );

            }


            loginButton.disabled =
              false;

            googleButton.disabled =
              false;

            loginButton.textContent =
              "Masuk";

            return;

          }


          /* SUCCESS */

          if (data && data.session) {

            showMessage(
              "Login berhasil! Mengarahkan...",
              "success"
            );

            loginButton.textContent =
              "Berhasil ✓";


            setTimeout(
              function() {

                window.location.href =
                  "index.html";

              },
              500
            );

          }


        } catch (error) {

          console.error(
            "Unexpected login error:",
            error
          );


          showMessage(
            "Terjadi kesalahan. Coba lagi.",
            "error"
          );


          loginButton.disabled =
            false;

          googleButton.disabled =
            false;

          loginButton.textContent =
            "Masuk";

        }

      }
    );


    /* =====================================
       RESEND EMAIL VERIFICATION
    ===================================== */

    resendButton.addEventListener(
      "click",
      async function() {

        const email =
          emailInput
            .value
            .trim();


        if (!email) {

          showMessage(
            "Masukkan email terlebih dahulu.",
            "error"
          );

          emailInput.focus();

          return;

        }


        if (!emailInput.checkValidity()) {

          showMessage(
            "Format email tidak valid.",
            "error"
          );

          emailInput.focus();

          return;

        }


        resendButton.disabled =
          true;

        resendButton.textContent =
          "Mengirim...";


        try {

          const {
            error
          } =
            await supabaseClient
              .auth
              .resend({

                type:
                  "signup",

                email:
                  email

              });


          if (error) {

            console.error(
              "Resend error:",
              error
            );

            showMessage(
              "Gagal mengirim ulang verifikasi.",
              "error"
            );

            resendButton.disabled =
              false;

            resendButton.textContent =
              "Kirim ulang verifikasi email";

            return;

          }


          showMessage(
            "Email verifikasi sudah dikirim ulang. Cek inbox kamu.",
            "success"
          );


          resendButton.textContent =
            "Email terkirim ✓";


        } catch (error) {

          console.error(
            error
          );

          showMessage(
            "Terjadi kesalahan. Coba lagi.",
            "error"
          );

          resendButton.disabled =
            false;

          resendButton.textContent =
            "Kirim ulang verifikasi email";

        }

      }
    );


    /* =====================================
       GOOGLE LOGIN
    ===================================== */

    googleButton.addEventListener(
      "click",
      async function() {

        googleButton.disabled =
          true;

        loginButton.disabled =
          true;

        googleButton.textContent =
          "Menghubungkan...";


        showMessage(
          "Menghubungkan ke Google...",
          "success"
        );


        try {

          const {
            error
          } =
            await supabaseClient
              .auth
              .signInWithOAuth({

                provider:
                  "google",

                options: {

                  redirectTo:
                    window.location.origin +
                    "/index.html"

                }

              });


          if (error) {

            console.error(
              "Google login error:",
              error
            );

            showMessage(
              "Login Google belum tersedia atau belum dikonfigurasi.",
              "error"
            );

            googleButton.disabled =
              false;

            loginButton.disabled =
              false;

            googleButton.textContent =
              "Masuk dengan Google";

          }

        } catch (error) {

          console.error(
            error
          );

          showMessage(
            "Gagal menghubungkan ke Google.",
            "error"
          );

          googleButton.disabled =
            false;

          loginButton.disabled =
            false;

          googleButton.textContent =
            "Masuk dengan Google";

        }

      }
    );


    /* =====================================
       SESSION CHECK
    ===================================== */

    async function checkExistingSession() {

      try {

        const {
          data
        } =
          await supabaseClient
            .auth
            .getSession();


        if (
          data &&
          data.session
        ) {

          /*
            User sudah login.
            Tidak dipaksa redirect agar
            halaman login tetap bisa dibuka.
          */

          console.log(
            "Active NEXTRA session detected."
          );

        }

      } catch (error) {

        console.error(
          "Session check error:",
          error
        );

      }

    }


    checkExistingSession();


    /* =====================================
       AUTH STATE
    ===================================== */

    supabaseClient
      .auth
      .onAuthStateChange(
        function(event, session) {

          console.log(
            "Auth event:",
            event
          );

        }
      );

  </script>

</body>

</html>
