<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#05070a"
  >

  <meta
    name="description"
    content="Login NEXTRA — Your Market. Your Intelligence."
  >

  <title>Login — NEXTRA</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #05070a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: #0c1013;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 25px 80px rgba(0,0,0,.45);
    }

    /* LOGO */

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo h1 {
      font-size: 34px;
      letter-spacing: -1px;
    }

    .logo span {
      color: #42f5a7;
    }

    .logo p {
      color: #7f8a91;
      font-size: 12px;
      margin-top: 6px;
    }

    /* TITLE */

    h2 {
      font-size: 22px;
      margin-bottom: 7px;
    }

    .subtitle {
      color: #7f8a91;
      font-size: 12px;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    /* LABEL */

    label {
      display: block;
      font-size: 12px;
      margin-bottom: 7px;
    }

    /* INPUT */

    input {
      width: 100%;
      height: 46px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.1);
      background: #12171a;
      color: white;
      padding: 0 14px;
      outline: none;
      transition: .2s ease;
    }

    input:focus {
      border-color: #42f5a7;
      box-shadow:
        0 0 0 3px
        rgba(66,245,167,.06);
    }

    input::placeholder {
      color: #59636a;
    }

    /* PASSWORD */

    .password-wrapper {
      position: relative;
      margin-bottom: 16px;
    }

    .password-wrapper input {
      padding-right: 50px;
      margin-bottom: 0;
    }

    /* EYE BUTTON */

    .toggle-password {
      position: absolute;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);

      width: 38px;
      height: 38px;

      padding: 0;
      margin: 0;

      border: none;
      border-radius: 9px;

      background: transparent;
      color: #69747b;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      transition: .2s ease;
    }

    .toggle-password:hover {
      background: rgba(255,255,255,.05);
      color: #42f5a7;
      filter: none;
    }

    .toggle-password:active {
      transform: translateY(-50%) scale(.94);
    }

    .toggle-password svg {
      width: 20px;
      height: 20px;
      display: block;
    }

    /* LOGIN BUTTON */

    .login-button {
      width: 100%;
      height: 46px;

      border: none;
      border-radius: 12px;

      background: #42f5a7;
      color: #06100b;

      font-weight: bold;
      cursor: pointer;

      margin-top: 4px;

      transition: .2s ease;
    }

    .login-button:hover {
      filter: brightness(1.05);
    }

    .login-button:active {
      transform: scale(.98);
    }

    .login-button:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    /* MESSAGE */

    .message {
      display: none;

      padding: 11px;

      border-radius: 10px;

      font-size: 12px;

      margin-bottom: 15px;

      line-height: 1.5;
    }

    .message.show {
      display: block;
    }

    .error {
      background: rgba(255,70,70,.1);
      color: #ff8585;
      border: 1px solid rgba(255,70,70,.12);
    }

    .success {
      background: rgba(66,245,167,.1);
      color: #42f5a7;
      border: 1px solid rgba(66,245,167,.12);
    }

    /* LINKS */

    .links {
      text-align: center;
      margin-top: 18px;
      font-size: 12px;
      color: #7f8a91;
    }

    a {
      color: #42f5a7;
      text-decoration: none;
      transition: .2s ease;
    }

    a:hover {
      text-decoration: underline;
    }

    /* DIVIDER */

    .divider {
      display: flex;
      align-items: center;

      gap: 10px;

      margin: 22px 0;

      color: #555;

      font-size: 10px;
    }

    .divider::before,
    .divider::after {
      content: "";

      height: 1px;

      background:
        rgba(255,255,255,.08);

      flex: 1;
    }

    /* SECURITY */

    .security-note {
      text-align: center;

      margin-top: 20px;

      color: #59636a;

      font-size: 10px;

      line-height: 1.5;
    }

    .security-note span {
      color: #42f5a7;
    }

    /* MOBILE */

    @media (max-width: 360px) {

      .login-box {
        padding: 24px;
      }

      .logo h1 {
        font-size: 30px;
      }

    }

  </style>

</head>

<body>

  <div class="login-box">

    <!-- LOGO -->

    <div class="logo">

      <h1>
        NEXTRA<span>.</span>
      </h1>

      <p>
        Your Market. Your Intelligence.
      </p>

    </div>

    <!-- TITLE -->

    <h2>
      Masuk
    </h2>

    <p class="subtitle">
      Masuk ke akun NEXTRA kamu.
    </p>

    <!-- MESSAGE -->

    <div
      id="message"
      class="message"
    ></div>

    <!-- FORM -->

    <form id="loginForm">

      <!-- EMAIL -->

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="nama@email.com"
        autocomplete="email"
        required
      >

      <!-- PASSWORD -->

      <label for="password">
        Password
      </label>

      <div class="password-wrapper">

        <input
          type="password"
          id="password"
          placeholder="Masukkan password"
          autocomplete="current-password"
          minlength="6"
          required
        >

        <button
          type="button"
          class="toggle-password"
          id="togglePassword"
          aria-label="Tampilkan password"
          title="Tampilkan password"
        >

          <!-- EYE ICON -->

          <svg
            id="eyeIcon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >

            <path
              d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
            />

            <circle
              cx="12"
              cy="12"
              r="3"
            />

          </svg>

        </button>

      </div>

      <!-- LOGIN BUTTON -->

      <button
        id="loginButton"
        class="login-button"
        type="submit"
      >
        Masuk
      </button>

    </form>

    <!-- FORGOT PASSWORD -->

    <div class="links">

      <a href="forgot-password.html">
        Lupa password?
      </a>

    </div>

    <!-- DIVIDER -->

    <div class="divider">
      ATAU
    </div>

    <!-- REGISTER -->

    <div class="links">

      Belum punya akun?

      <a href="register.html">
        Buat akun
      </a>

    </div>

    <!-- HOME -->

    <div class="links">

      <a href="index.html">
        ← Kembali ke NEXTRA
      </a>

    </div>

    <!-- SECURITY -->

    <div class="security-note">

      Login kamu diproses secara aman melalui
      <span>NEXTRA</span>.

    </div>

  </div>

  <!-- SUPABASE -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script>

    /* =====================================
       SUPABASE CONFIG
    ===================================== */

    const SUPABASE_URL =
      "https://uvtbntwgooxqjbyjkvkd.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Ensrp6OEPwQCoY76nQMFDg_lEofX2qO";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    /* =====================================
       ELEMENTS
    ===================================== */

    const form =
      document.getElementById(
        "loginForm"
      );

    const emailInput =
      document.getElementById(
        "email"
      );

    const passwordInput =
      document.getElementById(
        "password"
      );

    const togglePassword =
      document.getElementById(
        "togglePassword"
      );

    const eyeIcon =
      document.getElementById(
        "eyeIcon"
      );

    const message =
      document.getElementById(
        "message"
      );

    const loginButton =
      document.getElementById(
        "loginButton"
      );

    /* =====================================
       SHOW / HIDE PASSWORD
    ===================================== */

    togglePassword.addEventListener(
      "click",
      function() {

        const isPassword =
          passwordInput.type === "password";

        if (isPassword) {

          passwordInput.type = "text";

          eyeIcon.innerHTML = `
            <path d="M3 3l18 18"/>
            <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
            <path d="M9.9 5.2A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a18.5 18.5 0 0 1-3.1 3.8"/>
            <path d="M6.6 6.6C3.6 8.4 2 12 2 12s3.5 7 10 7a10.5 10.5 0 0 0 3.4-.6"/>
          `;

          togglePassword.setAttribute(
            "aria-label",
            "Sembunyikan password"
          );

          togglePassword.setAttribute(
            "title",
            "Sembunyikan password"
          );

        } else {

          passwordInput.type = "password";

          eyeIcon.innerHTML = `
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
            <circle cx="12" cy="12" r="3"/>
          `;

          togglePassword.setAttribute(
            "aria-label",
            "Tampilkan password"
          );

          togglePassword.setAttribute(
            "title",
            "Tampilkan password"
          );

        }

      }
    );

    /* =====================================
       MESSAGE
    ===================================== */

    function showMessage(
      text,
      type
    ) {

      message.textContent =
        text;

      message.className =
        "message show " + type;

    }

    function hideMessage() {

      message.textContent =
        "";

      message.className =
        "message";

    }

    /* =====================================
       LOGIN
    ===================================== */

    form.addEventListener(
      "submit",
      async function(e) {

        e.preventDefault();

        hideMessage();

        const email =
          emailInput
            .value
            .trim();

        const password =
          passwordInput
            .value;

        /* VALIDATION */

        if (!email) {

          showMessage(
            "Masukkan email kamu.",
            "error"
          );

          emailInput.focus();

          return;
        }

        if (!emailInput.checkValidity()) {

          showMessage(
            "Format email tidak valid.",
            "error"
          );

          emailInput.focus();

          return;
        }

        if (!password) {

          showMessage(
            "Masukkan password kamu.",
            "error"
          );

          passwordInput.focus();

          return;
        }

        if (password.length < 6) {

          showMessage(
            "Password minimal 6 karakter.",
            "error"
          );

          passwordInput.focus();

          return;
        }

        /* BUTTON */

        loginButton.disabled =
          true;

        loginButton.textContent =
          "Memproses...";

        showMessage(
          "Sedang masuk ke akun kamu...",
          "success"
        );

        try {

          /* SUPABASE LOGIN */

          const {
            error
          } =
            await supabaseClient
              .auth
              .signInWithPassword({

                email:
                  email,

                password:
                  password

              });

          /* ERROR */

          if (error) {

            console.error(
              "Login error:",
              error
            );

            let errorMessage =
              "Email atau password salah.";

            if (
              error.message &&
              error.message
                .toLowerCase()
                .includes(
                  "email not confirmed"
                )
            ) {

              errorMessage =
                "Email kamu belum diverifikasi.";

            }

            showMessage(
              errorMessage,
              "error"
            );

            loginButton.disabled =
              false;

            loginButton.textContent =
              "Masuk";

            return;
          }

          /* SUCCESS */

          showMessage(
            "Login berhasil! Mengarahkan...",
            "success"
          );

          loginButton.textContent =
            "Berhasil ✓";

          /* REDIRECT */

          setTimeout(
            () => {

              window.location.href =
                "index.html";

            },
            500
          );

        } catch (error) {

          console.error(
            "Unexpected login error:",
            error
          );

          showMessage(
            "Terjadi kesalahan. Coba lagi.",
            "error"
          );

          loginButton.disabled =
            false;

          loginButton.textContent =
            "Masuk";

        }

      }
    );

  </script>

</body>

</html>
