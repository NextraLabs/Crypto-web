<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#05070a"
  >

  <title>Lupa Password — NEXTRA</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      font-family: Arial, sans-serif;

      background: #05070a;

      color: #fff;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 400px;

      background: #0c1013;

      border: 1px solid rgba(255,255,255,.08);

      border-radius: 22px;

      padding: 30px;

      box-shadow:
        0 25px 80px
        rgba(0,0,0,.45);
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo h1 {
      font-size: 34px;
    }

    .logo span {
      color: #42f5a7;
    }

    .logo p {
      color: #7f8a91;
      font-size: 12px;
      margin-top: 6px;
    }

    h2 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #7f8a91;
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 12px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      height: 46px;

      border-radius: 12px;

      border: 1px solid rgba(255,255,255,.1);

      background: #12171a;

      color: white;

      padding: 0 14px;

      outline: none;

      margin-bottom: 16px;
    }

    input:focus {
      border-color: #42f5a7;

      box-shadow:
        0 0 0 3px
        rgba(66,245,167,.06);
    }

    input::placeholder {
      color: #59636a;
    }

    button {
      width: 100%;
      height: 46px;

      border: none;
      border-radius: 12px;

      background: #42f5a7;

      color: #06100b;

      font-weight: bold;

      cursor: pointer;

      transition: .2s ease;
    }

    button:hover {
      filter: brightness(1.05);
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;

      padding: 11px;

      border-radius: 10px;

      font-size: 12px;

      line-height: 1.5;

      margin-bottom: 15px;
    }

    .message.show {
      display: block;
    }

    .error {
      background: rgba(255,70,70,.1);
      color: #ff8585;
    }

    .success {
      background: rgba(66,245,167,.1);
      color: #42f5a7;
    }

    .links {
      text-align: center;

      margin-top: 20px;

      font-size: 12px;

      color: #7f8a91;
    }

    a {
      color: #42f5a7;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

  </style>

</head>

<body>

  <div class="box">

    <div class="logo">

      <h1>
        NEXTRA<span>.</span>
      </h1>

      <p>
        Your Market. Your Intelligence.
      </p>

    </div>

    <h2>
      Lupa Password?
    </h2>

    <p class="subtitle">
      Masukkan email akun NEXTRA kamu.
      Kami akan mengirimkan link untuk membuat password baru.
    </p>

    <div
      id="message"
      class="message"
    ></div>

    <form id="forgotForm">

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="nama@email.com"
        autocomplete="email"
        required
      >

      <button
        id="resetButton"
        type="submit"
      >
        Kirim Link Reset
      </button>

    </form>

    <div class="links">

      <a href="login.html">
        ← Kembali ke Login
      </a>

    </div>

  </div>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <script>

    const SUPABASE_URL =
      "https://uvtbntwgooxqjbyjkvkd.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Ensrp6OEPwQCoY76nQMFDg_lEofX2qO";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const form =
      document.getElementById(
        "forgotForm"
      );

    const emailInput =
      document.getElementById(
        "email"
      );

    const resetButton =
      document.getElementById(
        "resetButton"
      );

    const message =
      document.getElementById(
        "message"
      );


    function showMessage(
      text,
      type
    ) {

      message.textContent =
        text;

      message.className =
        "message show " + type;

    }


    form.addEventListener(
      "submit",
      async function(e) {

        e.preventDefault();


        const email =
          emailInput
            .value
            .trim();


        if (!email) {

          showMessage(
            "Masukkan email kamu.",
            "error"
          );

          return;

        }


        if (!emailInput.checkValidity()) {

          showMessage(
            "Format email tidak valid.",
            "error"
          );

          return;

        }


        resetButton.disabled =
          true;

        resetButton.textContent =
          "Mengirim...";


        showMessage(
          "Sedang mengirim link reset...",
          "success"
        );


        try {

          const {
            error
          } =
            await supabaseClient
              .auth
              .resetPasswordForEmail(
                email,
                {
                  redirectTo:
                    window.location.origin +
                    "/update-password.html"
                }
              );


          if (error) {

            console.error(
              "Reset password error:",
              error
            );

            showMessage(
              "Gagal mengirim link reset. Coba lagi.",
              "error"
            );

            resetButton.disabled =
              false;

            resetButton.textContent =
              "Kirim Link Reset";

            return;

          }


          showMessage(
            "Link reset sudah dikirim. Cek inbox email kamu.",
            "success"
          );


          resetButton.textContent =
            "Link Terkirim ✓";


        } catch (error) {

          console.error(
            error
          );

          showMessage(
            "Terjadi kesalahan. Coba lagi.",
            "error"
          );

          resetButton.disabled =
            false;

          resetButton.textContent =
            "Kirim Link Reset";

        }

      }
    );

  </script>

</body>

  </html>
