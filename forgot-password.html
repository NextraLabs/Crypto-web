<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password — NEXTRA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #05070a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 400px;
      background: #0c1013;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 25px 80px rgba(0,0,0,.45);
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo h1 {
      font-size: 34px;
    }

    .logo span {
      color: #42f5a7;
    }

    .logo p {
      color: #7f8a91;
      font-size: 12px;
      margin-top: 6px;
    }

    h2 {
      font-size: 22px;
      margin-bottom: 7px;
    }

    .subtitle {
      color: #7f8a91;
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 12px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      height: 46px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.1);
      background: #12171a;
      color: white;
      padding: 0 14px;
      outline: none;
      margin-bottom: 16px;
    }

    input:focus {
      border-color: #42f5a7;
    }

    button {
      width: 100%;
      height: 46px;
      border: none;
      border-radius: 12px;
      background: #42f5a7;
      color: #06100b;
      font-weight: bold;
      cursor: pointer;
    }

    .message {
      display: none;
      padding: 11px;
      border-radius: 10px;
      font-size: 12px;
      margin-bottom: 15px;
      line-height: 1.4;
    }

    .message.show {
      display: block;
    }

    .error {
      background: rgba(255,70,70,.1);
      color: #ff8585;
    }

    .success {
      background: rgba(66,245,167,.1);
      color: #42f5a7;
    }

    .links {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #7f8a91;
    }

    a {
      color: #42f5a7;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      <h1>NEXTRA<span>.</span></h1>
      <p>Your Market. Your Intelligence.</p>
    </div>

    <h2>Lupa Password?</h2>

    <p class="subtitle">
      Masukkan email akun NEXTRA kamu.
      Kami akan mengirimkan link untuk membuat
      password baru.
    </p>

    <div id="message" class="message"></div>

    <form id="resetForm">

      <label for="email">
        Email
      </label>

      <input
        id="email"
        type="email"
        placeholder="nama@email.com"
        autocomplete="email"
        required
      >

      <button type="submit">
        Kirim Link Reset
      </button>

    </form>

    <div class="links">
      <a href="login.html">
        ← Kembali ke Login
      </a>
    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://uvtbntwgooxqjbyjkvkd.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Ensrp6OEPwQCoY76nQMFDg_lEofX2qO";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const form =
      document.getElementById("resetForm");

    const message =
      document.getElementById("message");


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message show " + type;

    }


    form.addEventListener(
      "submit",
      async function(e) {

        e.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        showMessage(
          "Mengirim link reset...",
          "success"
        );


        const { error } =
          await supabaseClient.auth
            .resetPasswordForEmail(
              email,
              {
                redirectTo:
                  "https://mankamigurusinga-glitch.github.io/Crypto-web/reset-password.html"
              }
            );


        if (error) {

          showMessage(
            error.message,
            "error"
          );

          return;

        }


        showMessage(
          "Link reset password sudah dikirim. Cek email kamu.",
          "success"
        );


        form.reset();

      }
    );

  </script>

</body>
</html>
