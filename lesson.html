<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#070909"
  >

  <title>NEXTRA — Learn</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <style>

    .lesson-header {
      margin-bottom: 16px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
      text-decoration: none;
    }

    .lesson-category {
      color: var(--green);
      font-size: 8px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .lesson-title {
      margin: 5px 0 0;
      font-size: 24px;
      line-height: 1.15;
      font-weight: 900;
      letter-spacing: -.04em;
    }

    .lesson-subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.6;
    }

    .lesson-meta {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 11px;
    }

    .meta-pill {
      padding: 5px 8px;
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 8px;
      font-weight: 800;
    }

    .article-card {
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--surface);
    }

    .article-card h2 {
      margin: 0 0 9px;
      font-size: 14px;
      font-weight: 900;
    }

    .article-card h3 {
      margin: 15px 0 7px;
      font-size: 11px;
      font-weight: 900;
    }

    .article-card p {
      margin: 0 0 9px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.75;
    }

    .article-card ul {
      margin: 8px 0 0;
      padding-left: 18px;
    }

    .article-card li {
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.6;
    }

    .highlight {
      padding: 12px;
      margin-top: 11px;
      border-left: 3px solid var(--green);
      border-radius: 8px;
      background: rgba(57,242,160,.06);
      color: var(--text);
      font-size: 9px;
      line-height: 1.6;
    }

    .flow {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 11px;
    }

    .flow-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px;
      border-radius: 10px;
      background: var(--surface-soft);
    }

    .flow-number {
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      border-radius: 8px;
      background: rgba(57,242,160,.10);
      color: var(--green);
      font-size: 8px;
      font-weight: 900;
    }

    .flow-text {
      color: var(--muted);
      font-size: 9px;
      line-height: 1.5;
    }

    .example-box {
      padding: 13px;
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surface-soft);
    }

    .example-label {
      margin-bottom: 5px;
      color: var(--green);
      font-size: 8px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .example-text {
      color: var(--muted);
      font-size: 9px;
      line-height: 1.6;
    }

    .quiz-option {
      width: 100%;
      padding: 11px;
      margin-top: 7px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface-soft);
      color: var(--text);
      text-align: left;
      font-size: 9px;
      cursor: pointer;
    }

    .quiz-result {
      display: none;
      margin-top: 10px;
      padding: 10px;
      border-radius: 9px;
      background: rgba(57,242,160,.08);
      color: var(--green);
      font-size: 9px;
      line-height: 1.5;
    }

    .complete-box {
      padding: 16px;
      margin: 18px 0;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--surface);
      text-align: center;
    }

    .complete-icon {
      font-size: 28px;
    }

    .complete-title {
      margin-top: 7px;
      font-size: 13px;
      font-weight: 900;
    }

    .complete-text {
      margin-top: 5px;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.5;
    }

    .complete-button {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: var(--green);
      color: #07100c;
      font-size: 9px;
      font-weight: 900;
      cursor: pointer;
    }

    .navigation {
      display: flex;
      gap: 8px;
      margin: 15px 0;
    }

    .nav-button {
      flex: 1;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      text-align: center;
      text-decoration: none;
      font-size: 8px;
      font-weight: 800;
    }

    .disclaimer {
      margin: 18px 0;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--subtle);
      font-size: 8px;
      line-height: 1.5;
      text-align: center;
    }

  </style>

</head>

  <div class="navigation">

        </div>

      </article>


      <article class="article-card">

        <h2>Trading Journal</h2>

        <p>
          Catat alasan entry, kondisi market,
          hasil trade dan kesalahan yang terjadi.
        </p>

        <p>
          Dengan jurnal, trader dapat menemukan
          pola kesalahan dan memperbaiki proses
          secara bertahap.
        </p>

        <div class="highlight">
          🧠 Trader yang baik tidak hanya
          mengejar profit. Mereka juga membangun
          proses yang konsisten.
        </div>

      </article>

    `,

    question:
      "Apa fungsi utama trading plan?",

    options: [

      ["Membantu membuat keputusan trading secara terstruktur.", true],

      ["Menjamin semua trade profit.", false],

      ["Menghilangkan semua risiko market.", false]

    ]

  }

};


/* ================================
   GET LESSON
================================ */


const params =
  new URLSearchParams(
    window.location.search
  );


let lessonNumber =
  parseInt(
    params.get("lesson") || "1"
  );


if (
  !lessons[lessonNumber]
) {

  lessonNumber = 1;

}


const lesson =
  lessons[lessonNumber];


/* ================================
   HEADER
================================ */


document.getElementById(
  "lesson-header"
).innerHTML = `

  <a
    href="learn.html"
    class="back-link"
  >
    ← Back to Learn
  </a>

  <div class="lesson-category">
    ${lesson.category}
  </div>

  <h1 class="lesson-title">
    ${lesson.title}
  </h1>

  <p class="lesson-subtitle">
    ${lesson.subtitle}
  </p>

  <div class="lesson-meta">

    <span class="meta-pill">
      🌱 ${lesson.level}
    </span>

    <span class="meta-pill">
      ⏱ ${lesson.time}
    </span>

    <span class="meta-pill">
      Lesson ${lessonNumber}
    </span>

  </div>

`;


/* ================================
   CONTENT
================================ */


document.getElementById(
  "lesson-content"
).innerHTML =
  lesson.content;


/* ================================
   QUIZ
================================ */


document.getElementById(
  "quiz-question"
).textContent =
  lesson.question;


const quizOptions =
  document.getElementById(
    "quiz-options"
  );


lesson.options.forEach(
  (option) => {

    const button =
      document.createElement(
        "button"
      );

    button.className =
      "quiz-option";

    button.textContent =
      option[0];

    button.onclick =
      () => checkAnswer(
        option[1]
      );

    quizOptions.appendChild(
      button
    );

  }
);


function checkAnswer(
  correct
) {

  const result =
    document.getElementById(
      "quiz-result"
    );

  result.style.display =
    "block";

  if (correct) {

    result.textContent =
      "✓ Benar! Jawaban kamu tepat.";

  } else {

    result.textContent =
      "✕ Belum tepat. Coba baca kembali materi lesson ini.";

  }

}


/* ================================
   PROGRESS
================================ */


const storageKey =
  "nextra_lesson_" +
  lessonNumber;


function completeLesson() {

  localStorage.setItem(
    storageKey,
    "completed"
  );

  updateCompleteButton();

}


function updateCompleteButton() {

  const button =
    document.getElementById(
      "complete-button"
    );

  if (
    localStorage.getItem(
      storageKey
    ) === "completed"
  ) {

    button.textContent =
      "✓ Lesson Completed";

    button.style.opacity =
      ".65";

    button.disabled =
      true;

  }

}


updateCompleteButton();


/* ================================
   NAVIGATION
================================ */


const previousButton =
  document.getElementById(
    "previous-button"
  );

const nextButton =
  document.getElementById(
    "next-button"
  );


if (
  lessonNumber <= 1
) {

  previousButton.style.opacity =
    ".35";

  previousButton.style.pointerEvents =
    "none";

} else {

  previousButton.href =
    "lesson.html?lesson=" +
    (lessonNumber - 1);

}


if (
  lessonNumber >= 10
) {

  nextButton.textContent =
    "✓ Academy Complete";

  nextButton.style.opacity =
    ".5";

  nextButton.style.pointerEvents =
    "none";

} else {

  nextButton.href =
    "lesson.html?lesson=" +
    (lessonNumber + 1);

}


/* ================================
   THEME
================================ */


document
  .getElementById(
    "theme-toggle"
  )
  ?.addEventListener(
    "click",
    () => {

      if (
        typeof toggleTheme ===
        "function"
      ) {

        toggleTheme();

      }

    }
  );


</script>


</body>

</html>
