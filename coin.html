<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pantau — Coin</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
<div class="container">
  <div class="topbar">
    <div>
      <h1 class="title" id="coinTitle">Coin<span class="dot">.</span></h1>
      <p class="subtitle">Coin detail</p>
    </div>
    <button class="icon-btn" id="themeBtn">🌙</button>
  </div>
  <div class="coming-soon">
    <div class="big-icon">🔎</div>
    <p>Halaman detail koin — dibangun di Phase 3.</p>
  </div>
</div>
<div id="bottom-nav"></div>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
initTheme(); renderNav();
const b = document.getElementById("themeBtn");
b.textContent = document.documentElement.getAttribute("data-theme")==="dark"?"🌙":"☀️";
b.addEventListener("click",()=>{b.textContent=toggleTheme()==="dark"?"🌙":"☀️";});
const sym = new URLSearchParams(location.search).get("symbol");
if (sym) document.getElementById("coinTitle").innerHTML = sym + '<span class="dot">.</span>';
</script>
</body>
</html>
