<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pantau</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
<div class="container">
  <div class="topbar">
    <div><h1 class="title">Pantau<span class="dot">.</span></h1></div>
    <button class="icon-btn" id="themeBtn">🌙</button>
  </div>
  <div class="coming-soon">
    <div class="big-icon">🚧</div>
    <p>Halaman ini segera hadir.</p>
  </div>
</div>
<div id="bottom-nav"></div>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
initTheme(); renderNav();
const b = document.getElementById("themeBtn");
b.textContent = document.documentElement.getAttribute("data-theme")==="dark"?"🌙":"☀️";
b.addEventListener("click",()=>{b.textContent=toggleTheme()==="dark"?"🌙":"☀️";});
</script>
</body>
</html>
