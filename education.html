<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pantau — Edukasi</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<div class="container">
  <div class="topbar">
    <div>
      <h1 class="title">Pantau<span class="dot">.</span></h1>
      <p class="subtitle">Edukasi</p>
    </div>
    <div class="icon-group">
      <button class="icon-btn" id="themeBtn">🌙</button>
    </div>
  </div>

  <div class="coming-soon">
    <div class="big-icon">📚</div>
    <p>Halaman <strong>Edukasi</strong> segera hadir — lagi dibangun di phase berikutnya.</p>
  </div>
</div>

<div id="bottom-nav"></div>

<script type="module">
import { initTheme, toggleTheme } from "./js/app.js";
import { renderNav } from "./js/components/navigation.js";
initTheme();
renderNav();
document.getElementById("themeBtn").addEventListener("click", () => {
  const t = toggleTheme();
  document.getElementById("themeBtn").textContent = t === "dark" ? "🌙" : "☀️";
});
document.getElementById("themeBtn").textContent =
  document.documentElement.getAttribute("data-theme") === "dark" ? "🌙" : "☀️";
</script>
</body>
</html>
