<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NEXTRA — Radar</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>


<body>

<main class="container">

  <!-- HEADER -->

  <header class="topbar">

    <div>

      <h1 class="title">
        Radar<span class="dot">.</span>
      </h1>

      <p class="subtitle">
        Market opportunity scanner
      </p>

    </div>


    <div
      style="
        display:flex;
        gap:6px;
      "
    >

      <button
        class="icon-btn"
        id="radar-refresh"
      >
        ↻
      </button>

      <button
        class="icon-btn"
        id="theme-toggle"
      >
        ◐
      </button>

    </div>

  </header>


  <!-- STATUS -->

  <section
    class="highlight-box"
    style="
      margin-bottom:14px;
    "
  >

    <div
      style="
        display:flex;
        align-items:center;
        justify-content:space-between;
      "
    >

      <div>

        <div
          style="
            font-size:12px;
            font-weight:900;
          "
        >
          🔥 NEXTRA Radar
        </div>

        <div
          class="dim"
          style="
            font-size:8px;
            margin-top:4px;
          "
        >
          Scanning market opportunities
        </div>

      </div>


      <div
        id="radar-status"
        style="
          font-size:8px;
          color:var(--accent);
        "
      >
        SCANNING
      </div>

    </div>

  </section>


  <!-- MARKET OVERVIEW -->

  <section
    style="
      display:grid;
      grid-template-columns:
        repeat(3,1fr);
      gap:7px;
    "
  >

    <div
      class="coin-card"
      style="
        display:block;
        text-align:center;
        margin:0;
      "
    >

      <div
        class="dim"
        style="font-size:7px;"
      >
        BULLISH
      </div>

      <strong
        id="radar-bullish"
        class="up"
        style="
          display:block;
          font-size:16px;
          margin-top:4px;
        "
      >
        --
      </strong>

    </div>


    <div
      class="coin-card"
      style="
        display:block;
        text-align:center;
        margin:0;
      "
    >

      <div
        class="dim"
        style="font-size:7px;"
      >
        BEARISH
      </div>

      <strong
        id="radar-bearish"
        class="down"
        style="
          display:block;
          font-size:16px;
          margin-top:4px;
        "
      >
        --
      </strong>

    </div>


    <div
      class="coin-card"
      style="
        display:block;
        text-align:center;
        margin:0;
      "
    >

      <div
        class="dim"
        style="font-size:7px;"
      >
        SCANNED
      </div>

      <strong
        id="radar-scanned"
        style="
          display:block;
          font-size:16px;
          margin-top:4px;
        "
      >
        --
      </strong>

    </div>

  </section>


  <!-- FILTER -->

  <div
    style="
      display:flex;
      gap:6px;
      overflow-x:auto;
      margin:16px 0 10px;
      padding-bottom:2px;
    "
  >

    <button
      class="radar-filter active"
      data-filter="all"
    >
      All
    </button>

    <button
      class="radar-filter"
      data-filter="gainers"
    >
      🚀 Gainers
    </button>

    <button
      class="radar-filter"
      data-filter="losers"
    >
      🔴 Losers
    </button>

    <button
      class="radar-filter"
      data-filter="momentum"
    >
      ⚡ Momentum
    </button>

  </div>


  <!-- RADAR RESULTS -->

  <section id="radar-results">

    <div class="loading">
      Scanning market...
    </div>

  </section>


  <!-- INFO -->

  <div
    style="
      margin-top:18px;
      padding:12px;
      border:1px solid var(--border);
      border-radius:12px;
      color:var(--faint);
      font-size:8px;
      line-height:1.5;
      text-align:center;
    "
  >

    Opportunity Score adalah indikator
    otomatis berdasarkan momentum harga
    dan kondisi market.

    <br><br>

    Bukan sinyal trading dan bukan
    jaminan profit.

  </div>


</main>


<!-- BOTTOM NAV -->

<div id="bottom-nav"></div>


<!-- CORE -->

<script src="js/app.js"></script>

<script src="js/api.js"></script>


<script>

/* =========================================
   RADAR STATE
========================================= */

const RADAR = {

  symbols: [
    "BTCUSDT",
    "ETHUSDT",
    "BNBUSDT",
    "XRPUSDT",
    "SOLUSDT",
    "DOGEUSDT",
    "ADAUSDT",
    "AVAXUSDT",
    "LINKUSDT",
    "SUIUSDT",
    "TONUSDT"
  ],

  data: [],

  filter: "all"

};


/* =========================================
   LOAD
========================================= */

async function loadRadar() {

  const container =
    document.getElementById(
      "radar-results"
    );

  const status =
    document.getElementById(
      "radar-status"
    );


  if (status) {

    status.textContent =
      "SCANNING";

  }


  if (container) {

    container.innerHTML = `
      <div class="loading">
        Scanning market opportunities...
      </div>
    `;

  }


  try {

    const data =
      await NEXTRA_API
        .fetchFuturesMarkets(
          RADAR.symbols
        );


    RADAR.data =
      Array.isArray(data)
        ? data
        : [];


    renderRadar();


    if (status) {

      status.textContent =
        "LIVE";

    }

  }

  catch (error) {

    console.error(
      "Radar error:",
      error
    );


    if (status) {

      status.textContent =
        "ERROR";

    }


    if (container) {

      container.innerHTML = `
        <div class="error-box">
          ⚠️ Gagal memuat Radar.
          <br><br>
          Coba refresh kembali.
        </div>
      `;

    }

  }

}


/* =========================================
   SCORE
========================================= */

function getOpportunityScore(
  item
) {

  let score = 50;


  const change =
    Number(
      item.change24h
    ) || 0;


  const funding =
    Number(
      item.fundingRate
    ) || 0;


  /*
    MOMENTUM
  */

  if (change >= 8) {

    score += 30;

  }

  else if (change >= 5) {

    score += 24;

  }

  else if (change >= 3) {

    score += 18;

  }

  else if (change >= 1) {

    score += 10;

  }

  else if (change <= -8) {

    score += 30;

  }

  else if (change <= -5) {

    score += 24;

  }

  else if (change <= -3) {

    score += 18;

  }

  else if (change <= -1) {

    score += 10;

  }


  /*
    FUNDING EXTREME
  */

  if (
    Math.abs(funding)
    >= 0.001
  ) {

    score += 8;

  }

  else if (
    Math.abs(funding)
    >= 0.0005
  ) {

    score += 4;

  }


  return Math.max(
    0,
    Math.min(
      100,
      score
    )
  );

}


/* =========================================
   CLASSIFICATION
========================================= */

function getRadarType(
  item
) {

  const change =
    Number(
      item.change24h
    ) || 0;


  if (change >= 3) {

    return "gainers";

  }


  if (change <= -3) {

    return "losers";

  }


  if (
    Math.abs(change)
    >= 1.5
  ) {

    return "momentum";

  }


  return "normal";

}


/* =========================================
   SORT
========================================= */

function sortRadar(
  data
) {

  return [...data].sort(
    (
      a,
      b
    ) => {

      return (
        getOpportunityScore(b) -
        getOpportunityScore(a)
      );

    }
  );

}


/* =========================================
   FILTER
========================================= */

function filterRadar(
  data
) {

  if (
    RADAR.filter ===
    "all"
  ) {

    return data;

  }


  return data.filter(
    item =>
      getRadarType(item) ===
      RADAR.filter
  );

}


/* =========================================
   RENDER
========================================= */

function renderRadar() {

  updateRadarStats();


  const container =
    document.getElementById(
      "radar-results"
    );


  if (!container) {
    return;
  }


  let data =
    sortRadar(
      RADAR.data
    );


  data =
    filterRadar(
      data
    );


  if (!data.length) {

    container.innerHTML = `
      <div class="empty-state">
        Tidak ada aset yang cocok
        dengan filter ini.
      </div>
    `;

    return;

  }


  container.innerHTML =
    data
      .map(
        renderRadarCard
      )
      .join("");

}


/* =========================================
   STATS
========================================= */

function updateRadarStats() {

  const data =
    RADAR.data;


  const bullish =
    data.filter(
      item =>
        Number(
          item.change24h
        ) > 0
    ).length;


  const bearish =
    data.filter(
      item =>
        Number(
          item.change24h
        ) < 0
    ).length;


  const bullishElement =
    document.getElementById(
      "radar-bullish"
    );


  const bearishElement =
    document.getElementById(
      "radar-bearish"
    );


  const scannedElement =
    document.getElementById(
      "radar-scanned"
    );


  if (bullishElement) {

    bullishElement.textContent =
      bullish;

  }


  if (bearishElement) {

    bearishElement.textContent =
      bearish;

  }


  if (scannedElement) {

    scannedElement.textContent =
      data.length;

  }

}


/* =========================================
   CARD
========================================= */

function renderRadarCard(
  item
) {

  const score =
    getOpportunityScore(
      item
    );


  const change =
    Number(
      item.change24h
    ) || 0;


  const type =
    getRadarType(
      item
    );


  const positive =
    change >= 0;


  const changeClass =
    positive
      ? "up"
      : "down";


  const sign =
    positive
      ? "+"
      : "";


  let bias;


  if (change >= 3) {

    bias = `
      <span class="up">
        LONG BIAS
      </span>
    `;

  }

  else if (change <= -3) {

    bias = `
      <span class="down">
        SHORT BIAS
      </span>
    `;

  }

  else {

    bias = `
      <span class="dim">
        NEUTRAL
      </span>
    `;

  }


  return `

    <article
      class="coin-card"
      style="
        display:block;
        margin-bottom:10px;
      "
    >

      <div
        style="
          display:flex;
          justify-content:
            space-between;
          align-items:center;
        "
      >

        <div>

          <strong
            style="
              font-size:14px;
            "
          >
            ${item.symbol
              .replace(
                "USDT",
                "/USDT"
              )}
          </strong>

          <div
            class="dim"
            style="
              font-size:7px;
              margin-top:3px;
            "
          >
            ${type.toUpperCase()}
          </div>

        </div>


        <div
          style="
            text-align:right;
          "
        >

          <strong
            style="
              font-size:17px;
            "
          >
            ${score}
          </strong>

          <div
            class="dim"
            style="
              font-size:7px;
            "
          >
            SCORE
          </div>

        </div>

      </div>


      <!-- PRICE -->

      <div
        style="
          display:flex;
          justify-content:
            space-between;
          align-items:center;
          margin-top:10px;
        "
      >

        <span
          class="dim"
          style="font-size:8px;"
        >
          24H Change
        </span>

        <strong
          class="${changeClass}"
          style="font-size:11px;"
        >
          ${sign}${change.toFixed(2)}%
        </strong>

      </div>


      <!-- BAR -->

      <div
        style="
          height:5px;
          background:var(--border);
          border-radius:10px;
          overflow:hidden;
          margin-top:7px;
        "
      >

        <div
          style="
            width:${score}%;
            height:100%;
            background:var(--accent);
          "
        ></div>

      </div>


      <!-- METRICS -->

      <div
        style="
          display:grid;
          grid-template-columns:
            repeat(2,1fr);
          gap:7px;
          margin-top:10px;
        "
      >

        <div class="mini-stat">

          <span>
            Bias
          </span>

          <strong>
            ${bias}
          </strong>

        </div>


        <div class="mini-stat">

          <span>
            Funding
          </span>

          <strong>
            ${(
              Number(
                item.fundingRate
              ) * 100
            ).toFixed(4)}%
          </strong>

        </div>


        <div class="mini-stat">

          <span>
            Volume
          </span>

          <strong>
            ${formatRadarNumber(
              item.volume
            )}
          </strong>

        </div>


        <div class="mini-stat">

          <span>
            Price
          </span>

          <strong>
            ${formatRadarPrice(
              item.price
            )}
          </strong>

        </div>

      </div>


      <!-- REASON -->

      <div
        style="
          margin-top:9px;
          padding-top:9px;
          border-top:
            1px solid var(--border);
          font-size:8px;
        "
      >

        <span class="dim">
          Radar:
        </span>

        ${getRadarReason(item)}

      </div>

    </article>

  `;

}


/* =========================================
   REASON
========================================= */

function getRadarReason(
  item
) {

  const change =
    Number(
      item.change24h
    ) || 0;


  const funding =
    Number(
      item.fundingRate
    ) || 0;


  if (change >= 5) {

    if (
      funding > 0.001
    ) {

      return `
        Momentum kuat, tetapi
        funding mulai tinggi.
        Waspadai crowded long.
      `;

    }


    return `
      Momentum bullish kuat.
      Perhatikan volume dan
      konfirmasi breakout.
    `;

  }


  if (change <= -5) {

    if (
      funding < -0.001
    ) {

      return `
        Tekanan bearish kuat,
        tetapi short mulai crowded.
      `;

    }


    return `
      Tekanan bearish kuat.
      Tunggu konfirmasi sebelum
      mengambil posisi.
    `;

  }


  if (
    Math.abs(change)
    >= 1.5
  ) {

    return `
      Momentum mulai meningkat.
      Pantau arah pergerakan berikutnya.
    `;

  }


  return `
    Belum ada momentum signifikan.
    Market masih relatif tenang.
  `;

}


/* =========================================
   FORMAT NUMBER
========================================= */

function formatRadarNumber(
  value
) {

  const number =
    Number(value);


  if (
    !Number.isFinite(number)
  ) {

    return "-";

  }


  if (
    number >= 1e9
  ) {

    return (
      number / 1e9
    ).toFixed(2) + "B";

  }


  if (
    number >= 1e6
  ) {

    return (
      number / 1e6
    ).toFixed(2) + "M";

  }


  if (
    number >= 1e3
  ) {

    return (
      number / 1e3
    ).toFixed(2) + "K";

  }


  return number.toFixed(0);

}


/* =========================================
   FORMAT PRICE
========================================= */

function formatRadarPrice(
  value
) {

  const price =
    Number(value);


  if (
    !Number.isFinite(price)
  ) {

    return "-";

  }


  if (
    price >= 1000
  ) {

    return "$" +
      price.toLocaleString(
        "en-US",
        {
          maximumFractionDigits:2
        }
      );

  }


  if (
    price >= 1
  ) {

    return "$" +
      price.toFixed(2);

  }


  return "$" +
    price.toPrecision(5);

}


/* =========================================
   FILTER BUTTONS
========================================= */

document
  .querySelectorAll(
    ".radar-filter"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              ".radar-filter"
            )
            .forEach(
              item =>
                item.classList
                  .remove(
                    "active"
                  )
            );


          button.classList
            .add("active");


          RADAR.filter =
            button.dataset.filter;


          renderRadar();

        }
      );

    }
  );


/* =========================================
   REFRESH
========================================= */

document
  .getElementById(
    "radar-refresh"
  )
  ?.addEventListener(
    "click",
    () => {

      loadRadar();

    }
  );


/* =========================================
   THEME
========================================= */

document
  .getElementById(
    "theme-toggle"
  )
  ?.addEventListener(
    "click",
    () => {

      if (
        typeof toggleTheme ===
        "function"
      ) {

        toggleTheme();

      }

    }
  );


/* =========================================
   INIT
========================================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    loadRadar();

  }
);

</script>

</body>

</html>
