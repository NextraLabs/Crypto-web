<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pantau — Markets</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<div class="container">
  <div class="topbar">
    <div>
      <h1 class="title">Markets<span class="dot">.</span></h1>
      <p class="subtitle" id="marketsSubtitle">Memuat...</p>
    </div>
    <button class="icon-btn" id="themeBtn">🌙</button>
  </div>

  <input class="search-input" id="marketSearch" placeholder="Cari koin (BTC, ETH...)" style="margin: 16px 0 10px;" />

  <div class="tabs">
    <button class="tab filter-tab active" data-filter="all">Semua</button>
    <button class="tab filter-tab" data-filter="trending">Trending</button>
    <button class="tab filter-tab" data-filter="gainers">Naik</button>
    <button class="tab filter-tab" data-filter="losers">Turun</button>
  </div>

  <div id="errorContainer"></div>

  <table style="width:100%; border-collapse: collapse; margin-top: 12px; font-size: 12px;">
    <thead>
      <tr style="color: var(--faint); text-align:left; font-size: 10px; text-transform: uppercase;">
        <th style="padding: 6px 4px; width: 24px;">#</th>
        <th style="padding: 6px 4px;">Koin</th>
        <th style="padding: 6px 4px; text-align:right;">Harga</th>
        <th style="padding: 6px 4px; text-align:right;">24H</th>
      </tr>
    </thead>
    <tbody id="marketsBody">
      <tr><td colspan="4" class="loading">Memuat data pasar...</td></tr>
    </tbody>
  </table>
</div>

<div id="bottom-nav"></div>

<style>
  .market-row td { padding: 12px 4px; border-top: 1px solid var(--border); }
  .market-row { cursor: pointer; }
  .market-row:active { background: var(--card-hover); }
  .rank-cell { color: var(--faint); }
  .price-cell { text-align: right; }
  .change-cell { text-align: right; }
</style>

<script type="module">
import { initTheme, toggleTheme, renderError } from "./js/app.js";
import { renderNav } from "./js/components/navigation.js";
import { initMarkets } from "./js/features/market.js";
import { ALL_COINS } from "./js/api.js";

initTheme();
renderNav();

document.getElementById("themeBtn").addEventListener("click", () => {
  const t = toggleTheme();
  document.getElementById("themeBtn").textContent = t === "dark" ? "🌙" : "☀️";
});
document.getElementById("themeBtn").textContent =
  document.documentElement.getAttribute("data-theme") === "dark" ? "🌙" : "☀️";

initMarkets({
  onLoading: () => {
    document.getElementById("marketsSubtitle").textContent = "Memuat...";
    document.getElementById("errorContainer").innerHTML = "";
  },
  onLoaded: () => {
    document.getElementById("marketsSubtitle").textContent = `${ALL_COINS.length} koin · Binance · refresh 30 detik`;
  },
  onError: (err, retryFn) => {
    document.getElementById("marketsSubtitle").textContent = "Gagal memuat";
    renderError(document.getElementById("errorContainer"), "Unable to load market data. " + err.message, retryFn);
    document.getElementById("marketsBody").innerHTML = "";
  },
});
</script>
</body>
</html>
