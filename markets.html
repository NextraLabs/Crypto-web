<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NEXTRA — Markets</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body>

  <main class="container">


    <!-- ================================
         TOP BAR
    ================================= -->

    <header class="topbar">

      <div>

        <h1 class="title">
          Markets<span class="dot">.</span>
        </h1>

        <p class="subtitle">
          Live crypto market intelligence
        </p>

      </div>


      <button
        class="icon-btn"
        id="theme-toggle"
        title="Ganti tema"
      >
        ◐
      </button>

    </header>



    <!-- ================================
         SEARCH
    ================================= -->

    <section>

      <input
        id="market-search"
        class="search-input"
        type="search"
        placeholder="Cari Bitcoin, Ethereum, Solana..."
        autocomplete="off"
      >

    </section>



    <!-- ================================
         MARKET FILTER
    ================================= -->

    <div
      class="tabs"
      style="margin-top:14px;"
    >

      <button
        class="tab active"
        data-market-filter="all"
      >
        All
      </button>

      <button
        class="tab"
        data-market-filter="trending"
      >
        🔥 Trending
      </button>

      <button
        class="tab"
        data-market-filter="gainers"
      >
        🟢 Gainers
      </button>

      <button
        class="tab"
        data-market-filter="losers"
      >
        🔴 Losers
      </button>

      <button
        class="tab"
        data-market-filter="watchlist"
        onclick="
          NEXTRA_MARKETS.state.watchlistOnly =
          !NEXTRA_MARKETS.state.watchlistOnly;
          NEXTRA_MARKETS.state.page = 1;
          NEXTRA_MARKETS.filter();
        "
      >
        ⭐ Watchlist
      </button>

    </div>



    <!-- ================================
         MARKET STATS
    ================================= -->

    <section
      style="
        display:grid;
        grid-template-columns:
          repeat(3,1fr);
        gap:8px;
        margin:14px 0;
      "
    >

      <div
        class="coin-card"
        style="
          display:block;
          cursor:default;
          margin:0;
        "
      >

        <div class="dim">
          Coins
        </div>

        <strong
          id="market-total"
          style="
            display:block;
            margin-top:5px;
            font-size:18px;
          "
        >
          —
        </strong>

      </div>


      <div
        class="coin-card"
        style="
          display:block;
          cursor:default;
          margin:0;
        "
      >

        <div class="dim">
          Gainers
        </div>

        <strong
          id="market-gainers"
          class="up"
          style="
            display:block;
            margin-top:5px;
            font-size:18px;
          "
        >
          —
        </strong>

      </div>


      <div
        class="coin-card"
        style="
          display:block;
          cursor:default;
          margin:0;
        "
      >

        <div class="dim">
          Losers
        </div>

        <strong
          id="market-losers"
          class="down"
          style="
            display:block;
            margin-top:5px;
            font-size:18px;
          "
        >
          —
        </strong>

      </div>

    </section>



    <!-- ================================
         SORT
    ================================= -->

    <div
      style="
        display:flex;
        gap:6px;
        overflow-x:auto;
        padding-bottom:4px;
        margin-bottom:12px;
      "
    >

      <button
        class="icon-btn"
        data-market-sort="market_cap"
      >
        Market Cap
      </button>

      <button
        class="icon-btn"
        data-market-sort="price"
      >
        Price
      </button>

      <button
        class="icon-btn"
        data-market-sort="change1h"
      >
        1H
      </button>

      <button
        class="icon-btn"
        data-market-sort="change24h"
      >
        24H
      </button>

      <button
        class="icon-btn"
        data-market-sort="change7d"
      >
        7D
      </button>

      <button
        class="icon-btn"
        data-market-sort="volume"
      >
        Volume
      </button>

    </div>



    <!-- ================================
         COLUMN HEADER
    ================================= -->

    <div
      style="
        display:grid;
        grid-template-columns:
          28px 34px 1fr auto 30px;
        gap:12px;
        align-items:center;
        padding:0 15px 8px;
        color:var(--faint);
        font-size:9px;
        text-transform:uppercase;
        letter-spacing:.5px;
      "
    >

      <span>#</span>

      <span></span>

      <span>Asset</span>

      <span>Price</span>

      <span>★</span>

    </div>



    <!-- ================================
         MARKET LIST
    ================================= -->

    <section
      id="market-list"
    >

      <div class="loading">
        Memuat market...
      </div>

    </section>



    <!-- ================================
         PAGINATION
    ================================= -->

    <div
      id="market-pagination"
      style="
        display:flex;
        align-items:center;
        justify-content:center;
        margin-top:16px;
      "
    ></div>


    <!-- ================================
         SOURCE
    ================================= -->

    <div
      style="
        text-align:center;
        margin-top:20px;
        color:var(--faint);
        font-size:9px;
      "
    >
      Market data powered by CoinGecko
    </div>


  </main>



  <!-- ================================
       BOTTOM NAV MOUNT
  ================================= -->

  <div id="bottom-nav"></div>



  <!-- ================================
       SCRIPTS
  ================================= -->

  <script src="js/app.js"></script>

  <script src="js/api.js"></script>

  <script src="js/features/market.js"></script>


  <script>

    document
      .getElementById("theme-toggle")
      ?.addEventListener(
        "click",
        () => {

          toggleTheme();

        }
      );

  </script>


</body>

</html>
