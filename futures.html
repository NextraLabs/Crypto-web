<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NEXTRA — Futures</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body>

  <main class="container">


    <!-- HEADER -->

    <header class="topbar">

      <div>

        <h1 class="title">
          Futures<span class="dot">.</span>
        </h1>

        <p class="subtitle">
          Crypto perpetual futures intelligence
        </p>

      </div>


      <div
        style="
          display:flex;
          gap:6px;
        "
      >

        <button
          class="icon-btn"
          id="futures-refresh"
          title="Refresh"
        >
          ↻
        </button>


        <button
          class="icon-btn"
          id="theme-toggle"
          title="Ganti tema"
        >
          ◐
        </button>

      </div>

    </header>



    <!-- INFO -->

    <section
      class="highlight-box"
      style="
        margin-bottom:14px;
      "
    >

      <div
        style="
          display:flex;
          justify-content:space-between;
          align-items:center;
        "
      >

        <div>

          <div
            style="
              font-size:11px;
              font-weight:800;
            "
          >
            ⚡ Futures Scanner
          </div>

          <div
            class="dim"
            style="
              font-size:9px;
              margin-top:4px;
            "
          >
            Funding rate, open interest
            dan market bias.
          </div>

        </div>


        <div
          id="futures-update"
          style="
            font-size:8px;
            color:var(--accent);
          "
        >
          Loading...
        </div>

      </div>

    </section>



    <!-- FUTURES -->

    <section id="futures-content">

      <div class="loading">
        Memuat Futures...
      </div>

    </section>



    <!-- DISCLAIMER -->

    <div
      style="
        margin-top:18px;
        padding:12px;
        border:1px solid var(--border);
        border-radius:12px;
        color:var(--faint);
        font-size:8px;
        line-height:1.5;
        text-align:center;
      "
    >

      Data berasal dari endpoint publik
      Binance Futures.

      Funding rate dan bias hanyalah
      indikator market, bukan jaminan
      arah harga.

    </div>


  </main>



  <!-- BOTTOM NAV -->

  <div id="bottom-nav"></div>



  <!-- SCRIPTS -->

  <script src="js/app.js"></script>

  <script src="js/api.js"></script>

  <script src="js/features/futures.js"></script>


  <script>

    document
      .getElementById(
        "theme-toggle"
      )
      ?.addEventListener(
        "click",
        () => {

          toggleTheme();

        }
      );


    document
      .getElementById(
        "futures-refresh"
      )
      ?.addEventListener(
        "click",
        () => {

          NEXTRA_FUTURES.refresh();

        }
      );

  </script>


</body>

</html>
