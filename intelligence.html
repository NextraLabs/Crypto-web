<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#05070a"
  >

  <title>NEXTRA — Intelligence V100</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <style>

    .intel-v100 {
      display: grid;
      gap: 10px;
    }

    .intel-hero,
    .intel-card,
    .intel-stat,
    .intel-filter {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 15px;
    }

    .intel-hero {
      padding: 15px;
    }

    .intel-title {
      font-size: 19px;
      font-weight: 950;
    }

    .intel-sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 8px;
    }

    .intel-status {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      font-size: 8px;
      font-weight: 900;
    }

    .intel-live {
      color: var(--accent);
    }

    .intel-summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .intel-stat {
      padding: 10px 5px;
      text-align: center;
    }

    .intel-label {
      color: var(--muted);
      font-size: 6px;
      font-weight: 800;
    }

    .intel-value {
      margin-top: 4px;
      font-size: 14px;
      font-weight: 950;
    }

    .intel-filters {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 2px 0;
    }

    .intel-filter {
      flex: 0 0 auto;
      padding: 7px 11px;
      color: var(--text);
      font-size: 8px;
      font-weight: 900;
      cursor: pointer;
    }

    .intel-filter.active {
      background: var(--accent);
      color: #05070a;
      border-color: var(--accent);
    }

    #intelligence-content {
      display: grid;
      gap: 8px;
    }

    .intel-card {
      padding: 13px;
    }

    .intel-card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .intel-symbol {
      font-size: 13px;
      font-weight: 950;
    }

    .intel-price {
      margin-top: 5px;
      font-size: 17px;
      font-weight: 950;
    }

    .intel-change {
      margin-top: 2px;
      font-size: 8px;
      font-weight: 900;
    }

    .intel-badge {
      padding: 7px 9px;
      border: 1px solid var(--border);
      border-radius: 999px;
      text-align: center;
      font-size: 7px;
      font-weight: 950;
    }

    .up {
      color: var(--accent);
    }

    .down {
      color: var(--danger);
    }

    .neutral {
      color: var(--muted);
    }

    .intel-score {
      margin-top: 11px;
    }

    .intel-score-row {
      display: flex;
      justify-content: space-between;
      font-size: 7px;
      font-weight: 900;
    }

    .intel-bar {
      height: 5px;
      margin-top: 5px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
    }

    .intel-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
    }

    .intel-metrics {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-top: 10px;
    }

    .intel-metric {
      padding: 8px;
      border-radius: 10px;
      background: rgba(255,255,255,.025);
    }

    .intel-metric-label {
      color: var(--muted);
      font-size: 6px;
      font-weight: 800;
    }

    .intel-metric-value {
      margin-top: 3px;
      font-size: 9px;
      font-weight: 950;
    }

    .intel-insight {
      margin-top: 10px;
      padding: 9px;
      border-left: 2px solid var(--accent);
      border-radius: 7px;
      background: rgba(255,255,255,.025);
      font-size: 8px;
      line-height: 1.6;
    }

    .intel-bottom {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px solid var(--border);
      font-size: 7px;
      font-weight: 900;
    }

    .intel-empty {
      padding: 25px 12px;
      text-align: center;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 14px;
      font-size: 9px;
    }

    @media(max-width:420px) {

      .intel-summary {
        grid-template-columns: repeat(2, 1fr);
      }

    }

  </style>

</head>


<body>

<main class="container intel-v100">


  <header class="topbar">

    <div>

      <h1 class="title">
        Intelligence<span class="dot">.</span>
      </h1>

      <p class="subtitle">
        NEXTRA Market Intelligence V100
      </p>

    </div>

    <div
      style="
        display:flex;
        gap:6px;
      "
    >

      <button
        class="icon-btn"
        id="intel-refresh"
        title="Refresh"
      >
        ↻
      </button>

      <button
        class="icon-btn"
        id="theme-toggle"
        title="Theme"
      >
        ◐
      </button>

    </div>

  </header>


  <section class="intel-hero">

    <div class="intel-title">
      🧠 Market Intelligence
    </div>

    <div class="intel-sub">
      Multi-factor market analysis engine
    </div>

    <div class="intel-status">

      <span
        id="intel-status"
        class="intel-live"
      >
        READY
      </span>

      <span id="intel-update">
        --
      </span>

    </div>

  </section>


  <section class="intel-summary">

    <div class="intel-stat">

      <div class="intel-label">
        BULLISH
      </div>

      <div
        id="intel-bullish"
        class="intel-value up"
      >
        --
      </div>

    </div>


    <div class="intel-stat">

      <div class="intel-label">
        BEARISH
      </div>

      <div
        id="intel-bearish"
        class="intel-value down"
      >
        --
      </div>

    </div>


    <div class="intel-stat">

      <div class="intel-label">
        STRONG
      </div>

      <div
        id="intel-strong"
        class="intel-value"
      >
        --
      </div>

    </div>


    <div class="intel-stat">

      <div class="intel-label">
        RISK
      </div>

      <div
        id="intel-risk"
        class="intel-value down"
      >
        --
      </div>

    </div>

  </section>


  <div class="intel-filters">

    <button
      class="intel-filter active"
      data-filter="all"
    >
      ALL
    </button>

    <button
      class="intel-filter"
      data-filter="bullish"
    >
      🟢 BULLISH
    </button>

    <button
      class="intel-filter"
      data-filter="bearish"
    >
      🔴 BEARISH
    </button>

    <button
      class="intel-filter"
      data-filter="strong"
    >
      🎯 80+
    </button>

    <button
      class="intel-filter"
      data-filter="risk"
    >
      ⚠️ HIGH RISK
    </button>

  </div>


  <section id="intelligence-content">

    <div class="intel-empty">
      🧠 Analyzing market...
    </div>

  </section>


  <div
    style="
      padding:10px;
      border:1px solid var(--border);
      border-radius:12px;
      color:var(--faint);
      font-size:7px;
      line-height:1.5;
      text-align:center;
    "
  >

    Intelligence memberikan analisis berbasis data.
    Bukan jaminan profit atau prediksi pasti harga.

  </div>


</main>


<div id="bottom-nav"></div>


<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script src="js/features/intelligence.js"></script>


<script>

document
  .getElementById("intel-refresh")
  ?.addEventListener(
    "click",
    () => {

      if (
        window.NEXTRA_INTELLIGENCE
      ) {

        NEXTRA_INTELLIGENCE.refresh();

      }

    }
  );


document
  .getElementById("theme-toggle")
  ?.addEventListener(
    "click",
    () => {

      if (
        typeof toggleTheme === "function"
      ) {

        toggleTheme();

      }

    }
  );


document
  .querySelectorAll(".intel-filter")
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(".intel-filter")
            .forEach(
              item =>
                item.classList.remove(
                  "active"
                )
            );

          button.classList.add("active");

          window.NEXTRA_INTELLIGENCE_FILTER =
            button.dataset.filter;

          if (
            typeof renderIntelligenceV100 ===
            "function"
          ) {

            renderIntelligenceV100();

          }

        }
      );

    }
  );

</script>

</body>

</html>
